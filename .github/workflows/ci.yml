name: CI

on:
  push:
  pull_request:
  merge_group:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just
      - run: just ci
      - name: Build standalone kernels
        run: just build-kernels
      - name: Test standalone kernels
        run: just test-kernels
